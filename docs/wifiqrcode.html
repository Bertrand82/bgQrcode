<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR code Wi‑Fi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --input-bg: #1f2937;
      --link-bg: #1e293b;
      --link-hover: #334155;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .top-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .top-links a {
      text-decoration: none;
      background: var(--link-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .top-links a:hover {
      background: var(--link-hover);
      border-color: var(--accent);
    }

    h1 {
      text-align: center;
      margin: 0 0 18px;
      font-size: 1.8rem;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input, select, button {
      padding: 12px 14px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    button {
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: #052e16;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    #qrcode {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
    .qrcode-output {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qrcode-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      max-width: 260px;
    }
    .hint {
      color: var(--muted);
      font-size: 14px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 700px) {
      .row {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <nav class="top-links" aria-label="Navigation">
      <a href="index.html">Accueil</a>
      <a href="linkqrcode.html">QR code URL</a>
    </nav>

    <h1>Générateur de QR code Wi‑Fi</h1>

    <div class="grid">
      <div>
        <label for="title">Titre</label>
        <input id="title" type="text" maxlength="80" aria-describedby="titleHint" placeholder="Ex: Wi-Fi invités" />
        <div id="titleHint" class="hint">Champ optionnel affiché au-dessus du QR code.</div>
      </div>

      <div>
        <label for="ssid">Nom du Wi‑Fi (SSID)</label>
        <input id="ssid" type="text" placeholder="Ex: MonWifiMaison" />
      </div>

      <div class="row">
        <div>
          <label for="security">Sécurité</label>
          <select id="security">
            <option value="WPA">WPA/WPA2/WPA3</option>
            <option value="WEP">WEP</option>
            <option value="nopass">Aucune</option>
          </select>
        </div>

        <div>
          <label for="hidden">Réseau caché</label>
          <select id="hidden">
            <option value="false">Non</option>
            <option value="true">Oui</option>
          </select>
        </div>
      </div>

      <div>
        <label for="password">Mot de passe</label>
        <input id="password" type="text" placeholder="Mot de passe Wi‑Fi" />
        <div class="hint">Pour un réseau ouvert, laisse ce champ vide.</div>
      </div>

      <button id="generateBtn">Générer le QR code</button>
    </div>
    <div id="qrcode"></div>
  </div>

  <script>
    const QR_SIZE = 260;
    const MIN_SSID_FONT_SIZE = 12;
    const MAX_SSID_FONT_SIZE = 20;
    const SSID_TEXT_PADDING = 20;
    const SSID_LABEL_TOP_PADDING = 14;
    const SSID_LABEL_HEIGHT = 40;
    const MIN_TITLE_FONT_SIZE = 14;
    const MAX_TITLE_FONT_SIZE = 24;
    const TITLE_TEXT_PADDING = 20;
    const TITLE_LABEL_TOP_PADDING = 12;
    const TITLE_LABEL_HEIGHT = 44;

    function escapeWifiValue(value) {
      return value
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/:/g, "\\:")
        .replace(/"/g, '\\"');
    }

    function buildWifiString(ssid, security, password, hidden) {
      const safeSsid = escapeWifiValue(ssid);
      const safePassword = escapeWifiValue(password);

      if (security === "nopass") {
        return `WIFI:T:nopass;S:${safeSsid};H:${hidden};;`;
      }

      return `WIFI:T:${security};S:${safeSsid};P:${safePassword};H:${hidden};;`;
    }

    function getRenderedQrSource(container, timeoutMs = 1500) {
      return new Promise((resolve) => {
        let isResolved = false;
        let timeoutId;

        function finish(value) {
          if (isResolved) return;
          isResolved = true;
          clearTimeout(timeoutId);
          observer.disconnect();
          resolve(value);
        }

        function findSource() {
          const qrCanvas = container.querySelector("canvas");
          const qrImage = container.querySelector("img");

          if (qrCanvas) {
            return qrCanvas;
          }

          if (qrImage && qrImage.complete && qrImage.naturalWidth > 0) {
            return qrImage;
          }

          return null;
        }

        const immediateSource = findSource();
        if (immediateSource) {
          resolve(immediateSource);
          return;
        }

        const observer = new MutationObserver(() => {
          if (isResolved) return;
          const source = findSource();
          if (source) {
            finish(source);
          }
        });

        observer.observe(container, { childList: true, subtree: true });

        timeoutId = setTimeout(() => {
          finish(findSource());
        }, timeoutMs);
      });
    }

    function computeFittedFontSize(ctx, text, maxWidth, maxFontSize, minFontSize) {
      let fontSize = maxFontSize;

      while (fontSize > minFontSize) {
        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
        if (ctx.measureText(text).width <= maxWidth) {
          break;
        }

        fontSize -= 1;
      }

      return fontSize;
    }

    function generateQRCode() {
      const title = document.getElementById("title").value.trim();
      const ssid = document.getElementById("ssid").value.trim();
      const security = document.getElementById("security").value;
      const password = document.getElementById("password").value;
      const hidden = document.getElementById("hidden").value;
      const container = document.getElementById("qrcode");

      container.innerHTML = "";

      if (!ssid) {
        alert("Veuillez renseigner le nom du réseau Wi‑Fi.");
        return;
      }

      if (security !== "nopass" && !password) {
        alert("Veuillez renseigner le mot de passe.");
        return;
      }

      const wifiString = buildWifiString(ssid, security, password, hidden);
      const output = document.createElement("div");
      output.className = "qrcode-output";

      if (title) {
        const titleElement = document.createElement("div");
        titleElement.className = "qrcode-title";
        titleElement.textContent = title;
        output.appendChild(titleElement);
      }

      const qrTarget = document.createElement("div");
      output.appendChild(qrTarget);
      container.appendChild(output);

      new QRCode(qrTarget, {
        text: wifiString,
        width: QR_SIZE,
        height: QR_SIZE
      });

      getRenderedQrSource(container).then((source) => {
        if (!source) return;

        const qrWidth = source.width || QR_SIZE;
        const qrHeight = source.height || QR_SIZE;
        const finalCanvas = document.createElement("canvas");

        const titleLabelHeight = title ? TITLE_LABEL_HEIGHT : 0;

        finalCanvas.width = qrWidth;
        finalCanvas.height = titleLabelHeight + qrHeight + SSID_LABEL_HEIGHT;

        const ctx = finalCanvas.getContext("2d");
        if (!ctx) {
          console.error("Impossible de générer l'image QR.");
          return;
        }

        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
        if (title) {
          const titleFontSize = computeFittedFontSize(
            ctx,
            title,
            qrWidth - TITLE_TEXT_PADDING * 2,
            MAX_TITLE_FONT_SIZE,
            MIN_TITLE_FONT_SIZE
          );
          ctx.fillStyle = "#111";
          ctx.font = `bold ${titleFontSize}px Arial, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          ctx.fillText(title, qrWidth / 2, TITLE_LABEL_TOP_PADDING);
        }

        ctx.drawImage(source, 0, titleLabelHeight, qrWidth, qrHeight);

        const ssidFontSize = computeFittedFontSize(
          ctx,
          ssid,
          qrWidth - SSID_TEXT_PADDING * 2,
          MAX_SSID_FONT_SIZE,
          MIN_SSID_FONT_SIZE
        );
        ctx.fillStyle = "#111";
        ctx.font = `bold ${ssidFontSize}px Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(ssid, qrWidth / 2, titleLabelHeight + qrHeight + SSID_LABEL_TOP_PADDING);

        container.innerHTML = "";
        container.appendChild(finalCanvas);
      });
    }

    document.getElementById("generateBtn").addEventListener("click", generateQRCode);
  </script>
</body>
</html>
